services:
  # 后端API服务
  - type: web
    name: cooker-backend
    env: node
    plan: starter
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: cooker-database
          property: connectionString
      - key: USE_MOCK
        value: false
    healthCheckPath: /test
    autoDeploy: true

  # 前端静态网站
  - type: web
    name: cooker-frontend
    env: static
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://cookerreference.onrender.com
    autoDeploy: true
